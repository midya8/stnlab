[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "stnlab"
version = "0.1.0"
description = "Exact tiny temporal constraints with tight paths and schedule witnesses"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
stnlab = "stnlab.__main__:main"
stnlab-insertions = "stnlab.insertions:main"
[tool.setuptools]
packages = ["stnlab"]
